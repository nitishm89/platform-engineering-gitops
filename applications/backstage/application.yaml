apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backstage
  namespace: argocd

spec:
  project: default

  sources:

    - repoURL: https://github.com/backstage/charts
      targetRevision: main
      path: charts/backstage

      helm:
        valueFiles:
          - $values/helm-values/backstage/values.yaml

    - repoURL: https://github.com/nitishm89/platform-engineering-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: backstage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
