apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/nitishm89/platform-engineering-gitops.git
    targetRevision: main
    path: applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
